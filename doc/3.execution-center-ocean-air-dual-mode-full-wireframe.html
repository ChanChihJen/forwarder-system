&lt;header class=&quot;topbar&quot;&gt;
  &lt;div&gt;&lt;div class=&quot;page-title&quot;&gt;Execution Center｜SI + MBL + 出口報關 + 拖車進倉 + On Board&lt;/div&gt;&lt;div class=&quot;subtitle&quot;&gt;Execution Center 內整合文件上游、外部 MBL、報關、拖車/進倉與上船確認；Document Center 僅作查詢與下載。&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;btn&quot;&gt;返回 Execution Center&lt;/button&gt;&lt;button class=&quot;btn gray&quot;&gt;開啟 Job&lt;/button&gt;&lt;button class=&quot;btn&quot; onclick=&quot;openDocumentFlow()&quot;&gt;Document Flow&lt;/button&gt;&lt;button class=&quot;btn primary&quot;&gt;儲存&lt;/button&gt;&lt;/div&gt;
&lt;/header&gt;
&lt;main class=&quot;content&quot;&gt;
  &lt;div class=&quot;note&quot;&gt;設計原則：本頁不是獨立新模組，而是 Execution Center 裡的「SI / MBL 節點詳情」。使用者從 Execution Timeline 點擊 SI 或 MBL 進入此頁；MBL PDF 最後可同步到 Document Center。&lt;/div&gt;

  &lt;section class=&quot;card&quot;&gt;
    &lt;div class=&quot;section-title&quot;&gt;Job / Shipment Summary&lt;/div&gt;
    &lt;div class=&quot;summary-grid&quot;&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Job No.&lt;/b&gt;&lt;span&gt;FSEJ25040001&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Shipment&lt;/b&gt;&lt;span&gt;Shipment 1｜FCL&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Carrier&lt;/b&gt;&lt;span&gt;COSCO&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Vessel / Voyage&lt;/b&gt;&lt;span&gt;OOCL BEIJING / 092S&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;POL → POD&lt;/b&gt;&lt;span&gt;SHANGHAI → MELBOURNE&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;ETD / ETA&lt;/b&gt;&lt;span&gt;2021-10-30 / 2021-11-10&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;layout&quot;&gt;
    &lt;aside class=&quot;sidebar&quot;&gt;
      &lt;section class=&quot;card&quot;&gt;
        &lt;div class=&quot;section-title&quot;&gt;Execution Timeline&lt;/div&gt;
        &lt;div class=&quot;doc-flow-callout purple&quot;&gt;
          &lt;div&gt;&lt;b&gt;文件流程追蹤&lt;/b&gt;&lt;div class=&quot;hint&quot;&gt;從 SI、MBL、報關到 On Board，查看文件來源、狀態與依賴關係。&lt;/div&gt;&lt;/div&gt;
          &lt;button class=&quot;btn primary&quot; onclick=&quot;openDocumentFlow()&quot;&gt;Document Flow&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;timeline&quot;&gt;
          &lt;div class=&quot;step done&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;1. 訂艙確認 / SO&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;SO25040001 已取得&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill green&quot;&gt;Done&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step active&quot; onclick=&quot;openTab('si')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;2. SI 發送&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;目前 Draft，可發送給 Carrier / Co-loader&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill blue&quot;&gt;Active&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step warn&quot; onclick=&quot;openTab('mbl')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;3. MBL Draft / Final&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;等待 Draft MBL 回覆&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill amber&quot;&gt;Waiting&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step warn&quot; onclick=&quot;openTab('customs')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;4. 出口報關&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;報關資料準備中，待送關&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill amber&quot;&gt;Open&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot; onclick=&quot;openTab('trucking')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;5. 拖車 / 進倉&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;可安排車行 / 倉庫作業&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill gray&quot;&gt;Todo&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step lock&quot; onclick=&quot;openTab('onboard')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;6. On Board&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;待船公司 / MBL 回覆確認&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill gray&quot;&gt;Locked&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;
      &lt;section class=&quot;card&quot;&gt;
        &lt;div class=&quot;section-title&quot;&gt;目前待辦&lt;/div&gt;
        &lt;div class=&quot;logline&quot;&gt;確認 SI 是否採用 HBL Party 資料或另行 Override。&lt;/div&gt;
        &lt;div class=&quot;logline&quot;&gt;SI 發送後，等待 Carrier 回傳 Draft MBL PDF。&lt;/div&gt;
        &lt;div class=&quot;logline&quot;&gt;出口報關資料尚未送關；拖車與倉庫作業待安排。&lt;/div&gt;
      &lt;/section&gt;
    &lt;/aside&gt;

    &lt;main&gt;
      &lt;section class=&quot;card&quot;&gt;
        &lt;div class=&quot;section-title&quot;&gt;Execution 狀態流程&lt;/div&gt;
        &lt;div class=&quot;flow&quot;&gt;
          &lt;span class=&quot;flow-step done&quot;&gt;SO Confirmed&lt;/span&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;

        &lt;div style=&quot;margin-top:12px;text-align:right&quot;&gt;&lt;button class=&quot;btn gray&quot; onclick=&quot;openDocumentFlow()&quot;&gt;查看對應 Document Flow&lt;/button&gt;&lt;/div&gt;
      &lt;/section&gt;

      &lt;nav class=&quot;tabs&quot;&gt;
        &lt;button class=&quot;tab active&quot; data-tab=&quot;si&quot; onclick=&quot;openTab('si')&quot;&gt;SI 發送&lt;/button&gt;
        &lt;button class=&quot;tab&quot; data-tab=&quot;mbl&quot; onclick=&quot;openTab('mbl')&quot;&gt;MBL 管理&lt;/button&gt;

&lt;header class=&quot;topbar&quot;&gt;
  &lt;div&gt;&lt;div class=&quot;page-title&quot;&gt;Air Export Execution Center｜空運出口執行中心&lt;/div&gt;&lt;div class=&quot;subtitle&quot;&gt;空運出口專用流程：Space Confirm、HAWB、進倉、出口報關、安檢、MAWB、Flight Departure / Arrival 與交付追蹤&lt;/div&gt;&lt;/div&gt;

&lt;/header&gt;
&lt;main class=&quot;content&quot;&gt;
  &lt;div class=&quot;note&quot;&gt;定位：這是海運 Execution Center 的空運版本。核心仍是「Job / Shipment + Execution 節點 + 文件附件 + 狀態控管」，但把 SI / MBL / On Board 改為空運常見的 HAWB、MAWB、Cargo Received、Security Screening、Flight Departure / Arrival。&lt;/div&gt;
  &lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;Air Job / Shipment Summary&lt;/div&gt;&lt;div class=&quot;summary-grid&quot;&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Job No.&lt;/b&gt;&lt;span&gt;FAEJ26050001&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Shipment&lt;/b&gt;&lt;span&gt;Air Export｜Consol&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Airline / Agent&lt;/b&gt;&lt;span&gt;CI / TPE Cargo&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Flight&lt;/b&gt;&lt;span&gt;CI-008 / 2026-05-08&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;Origin → Destination&lt;/b&gt;&lt;span&gt;TPE → LAX&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;summary-item&quot;&gt;&lt;b&gt;ETD / ETA&lt;/b&gt;&lt;span&gt;05-08 23:50 / 05-08 20:40&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;aside class=&quot;sidebar&quot;&gt;
      &lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;Air Execution Timeline&lt;/div&gt;&lt;div class=&quot;timeline&quot;&gt;
        &lt;div class=&quot;step done&quot; onclick=&quot;openTab('space')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;1. Space / Booking Confirm&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;航空公司 / 空運代理已確認艙位&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill green&quot;&gt;Done&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;step active&quot; onclick=&quot;openTab('hawb')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;2. HAWB Draft / Issue&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;HAWB 草稿確認與正式開立&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill blue&quot;&gt;Active&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;step warn&quot; onclick=&quot;openTab('warehouse')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;3. Cargo Received / Warehouse&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;等待倉庫入倉、秤重、丈量&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill amber&quot;&gt;Open&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;div class=&quot;step&quot; onclick=&quot;openTab('security')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;5. Security / Screening&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;安檢、危險品、電池貨提示&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill gray&quot;&gt;Todo&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot; onclick=&quot;openTab('mawb')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;6. MAWB / Manifest&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;航空公司主單與艙單資料&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill gray&quot;&gt;Todo&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;step lock&quot; onclick=&quot;openTab('flight')&quot;&gt;&lt;div class=&quot;step-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;step-title&quot;&gt;7. Flight / Delivery&lt;/div&gt;&lt;div class=&quot;step-desc&quot;&gt;ATD / ATA / POD 待更新&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;pill gray&quot;&gt;Locked&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;&lt;/section&gt;
      &lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;目前待辦&lt;/div&gt;&lt;div class=&quot;logline&quot;&gt;確認 HAWB Party、件重尺與品名是否可正式出單。&lt;/div&gt;&lt;div class=&quot;logline&quot;&gt;等待倉庫回傳實際重量 / 材積，計算 Chargeable Weight。&lt;/div&gt;&lt;div class=&quot;logline&quot;&gt;鋰電池貨需確認 MSDS / DG Declaration / Security Screening 狀態。&lt;/div&gt;&lt;/section&gt;
